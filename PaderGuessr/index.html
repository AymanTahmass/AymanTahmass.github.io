<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniGuessr - Das Campus Quiz</title>
    
    <!-- Tailwind CSS für einfaches, modernes Design -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Leaflet CSS & JS für die interaktive Karte (Kostenlos, kein API Key nötig) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <style>
        /* Spezifische Höhe für die Karte */
        #map { height: 100%; min-height: 400px; z-index: 10; }
        .image-container { height: 50vh; min-height: 300px; }
        
        /* Verstecke UI Elemente initial */
        .hidden { display: none !important; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-blue-800 text-white p-4 shadow-md flex justify-between items-center">
        <h1 class="text-2xl font-bold">🎓 UniGuessr</h1>
        <div class="text-lg">
            Runde: <span id="round-display">1/5</span> | Punkte: <span id="score-display" class="font-bold">0</span>
        </div>
    </header>

    <!-- Main Game Area -->
    <main class="flex-grow flex flex-col md:flex-row overflow-hidden relative">
        
        <!-- Linke Seite: Das zu erratende Bild -->
        <div class="w-full md:w-1/2 p-4 flex flex-col bg-white border-r">
            <h2 class="text-xl font-semibold mb-2">Wo auf dem Campus ist das?</h2>
            <div class="relative flex-grow rounded-lg overflow-hidden border-4 border-gray-200 bg-gray-50 flex items-center justify-center">
                <img id="location-image" src="" alt="Campus Ort" class="object-contain w-full h-full">
            </div>
            
            <div class="mt-4 p-4 bg-blue-50 rounded-lg hidden" id="result-panel">
                <h3 class="text-lg font-bold text-blue-800 mb-1" id="result-title">Ergebnis</h3>
                <p id="result-text" class="mb-3">Du warst <span id="distance-text" class="font-bold"></span> Meter entfernt!</p>
                <button id="next-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded transition">
                    Nächste Runde
                </button>
            </div>
        </div>

        <!-- Rechte Seite: Die interaktive Karte -->
        <div class="w-full md:w-1/2 relative h-[50vh] md:h-auto">
            <div id="map"></div>
            
            <!-- Button zum Raten (liegt über der Karte) -->
            <button id="guess-btn" class="absolute bottom-6 left-1/2 transform -translate-x-1/2 z-[1000] bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-8 rounded-full shadow-lg transition opacity-50 cursor-not-allowed" disabled>
                Hier tippen!
            </button>
        </div>

    </main>

    <!-- End Screen (Overlay) -->
    <div id="end-screen" class="fixed inset-0 bg-black bg-opacity-80 z-[2000] hidden flex items-center justify-center">
        <div class="bg-white p-8 rounded-xl max-w-md w-full text-center">
            <h2 class="text-3xl font-bold mb-4">Spiel Beendet! 🎉</h2>
            <p class="text-xl mb-6">Deine Gesamtpunktzahl:<br><span id="final-score" class="text-4xl font-black text-blue-600">0</span></p>
            <button onclick="location.reload()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-lg w-full">
                Nochmal spielen
            </button>
        </div>
    </div>

    <script>
        // === HIER DEINE EIGENEN DATEN EINTRAGEN ===
        // Koordinaten deines Campus (Zentrum der Karte).
        // Standardmäßig hier die Uni Paderborn eingestellt ;)
        const CAMPUS_CENTER = [51.7067, 8.7711]; 
        const INITIAL_ZOOM = 16;

        // Deine Standorte. Mache eigene Fotos, lade sie hoch (z.B. Imgur oder auf deinen Server)
        // und trage hier die URL und die echten Koordinaten ein.
        const locations = [
            {
                id: 1,
                name: "Audimax",
                imgUrl: "https://placehold.co/800x600?text=Foto+vom+Audimax",
                lat: 51.7075, 
                lng: 8.7725
            },
            {
                id: 2,
                name: "Bibliothek",
                imgUrl: "https://placehold.co/800x600?text=Details+an+der+Bib",
                lat: 51.7060, 
                lng: 8.7730
            },
            {
                id: 3,
                name: "Mensa",
                imgUrl: "https://placehold.co/800x600?text=Eingang+Mensa",
                lat: 51.7082, 
                lng: 8.7705
            },
            {
                id: 4,
                name: "Sportanlagen",
                imgUrl: "https://placehold.co/800x600?text=Sporthalle+von+innen",
                lat: 51.7095, 
                lng: 8.7670
            },
            {
                id: 5,
                name: "Versteckte Statue",
                imgUrl: "https://placehold.co/800x600?text=Statue+im+Park",
                lat: 51.7050, 
                lng: 8.7750
            }
        ];
        // ==========================================

        // Spielstatus Variablen
        let currentRound = 0;
        let score = 0;
        let maxRounds = locations.length;
        let currentMarker = null;
        let actualMarker = null;
        let connectionLine = null;
        let hasGuessed = false;

        // Karte initialisieren (Leaflet)
        const map = L.map('map').setView(CAMPUS_CENTER, INITIAL_ZOOM);

        // OpenStreetMap Kartenmaterial laden
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
            maxZoom: 19
        }).addTo(map);

        // DOM Elemente referenzieren
        const imgElement = document.getElementById('location-image');
        const guessBtn = document.getElementById('guess-btn');
        const nextBtn = document.getElementById('next-btn');
        const resultPanel = document.getElementById('result-panel');
        const distanceText = document.getElementById('distance-text');
        const scoreDisplay = document.getElementById('score-display');
        const roundDisplay = document.getElementById('round-display');

        // Klick auf die Karte (Tipp abgeben)
        map.on('click', function(e) {
            if (hasGuessed) return; // Nichts tun, wenn schon geraten wurde

            if (currentMarker) {
                map.removeLayer(currentMarker);
            }

            // Custom Marker Icon (Blau für den Tipp)
            currentMarker = L.marker(e.latlng).addTo(map);
            
            // Button aktivieren
            guessBtn.disabled = false;
            guessBtn.classList.remove('opacity-50', 'cursor-not-allowed');
        });

        // "Hier tippen" Button Logik
        guessBtn.addEventListener('click', () => {
            if (!currentMarker || hasGuessed) return;
            hasGuessed = true;

            const currentLocation = locations[currentRound];
            const actualLatLng = L.latLng(currentLocation.lat, currentLocation.lng);
            const guessedLatLng = currentMarker.getLatLng();

            // Distanz berechnen (in Metern)
            const distance = Math.round(map.distance(actualLatLng, guessedLatLng));
            
            // Punkte berechnen (Max 5000 pro Runde, nimmt ab 50m Distanz rapide ab)
            let points = 5000;
            if (distance > 20) { // 20 Meter Toleranz
                points = Math.max(0, 5000 - (distance * 10)); // Je weiter weg, desto weniger Punkte
            }
            score += points;

            // UI Updaten
            scoreDisplay.innerText = score;
            distanceText.innerText = distance;
            
            // Wahren Standort anzeigen
            const greenIcon = new L.Icon({
              iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-green.png',
              shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
              iconSize: [25, 41],
              iconAnchor: [12, 41],
              popupAnchor: [1, -34],
              shadowSize: [41, 41]
            });
            actualMarker = L.marker(actualLatLng, {icon: greenIcon}).addTo(map)
                .bindPopup(`<b>${currentLocation.name}</b><br>Echter Standort`).openPopup();

            // Linie zwischen Tipp und Wahrheit ziehen
            connectionLine = L.polyline([guessedLatLng, actualLatLng], {color: 'red', dashArray: '5, 5'}).addTo(map);
            
            // Karte zoomen, um beide Punkte zu zeigen
            map.fitBounds(connectionLine.getBounds(), {padding: [50, 50]});

            // UI anpassen
            guessBtn.classList.add('hidden');
            resultPanel.classList.remove('hidden');
            
            if (currentRound === maxRounds - 1) {
                nextBtn.innerText = "Ergebnis ansehen";
            }
        });

        // "Nächste Runde" Button Logik
        nextBtn.addEventListener('click', () => {
            currentRound++;
            
            if (currentRound >= maxRounds) {
                // Spielende
                document.getElementById('final-score').innerText = score;
                document.getElementById('end-screen').classList.remove('hidden');
            } else {
                // Nächste Runde vorbereiten
                startRound();
            }
        });

        // Spiel/Runde starten
        function startRound() {
            hasGuessed = false;
            
            // UI zurücksetzen
            resultPanel.classList.add('hidden');
            guessBtn.classList.remove('hidden');
            guessBtn.disabled = true;
            guessBtn.classList.add('opacity-50', 'cursor-not-allowed');
            roundDisplay.innerText = `${currentRound + 1}/${maxRounds}`;
            
            // Karte aufräumen
            if (currentMarker) map.removeLayer(currentMarker);
            if (actualMarker) map.removeLayer(actualMarker);
            if (connectionLine) map.removeLayer(connectionLine);
            currentMarker = null;
            
            // Karte wieder auf Uni zentrieren
            map.setView(CAMPUS_CENTER, INITIAL_ZOOM);
            
            // Neues Bild laden
            imgElement.src = locations[currentRound].imgUrl;
        }

        // Spiel initial starten
        startRound();

    </script>
</body>
</html>
